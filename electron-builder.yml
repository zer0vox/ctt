appId: com.tokenpup.app
productName: Token Pup
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Restores Claude Code's status line on uninstall (see the file for details).
  include: build/installer.nsh
